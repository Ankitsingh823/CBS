spring.application.name=DEMO
# Server configuration
server.port=8000
server.address=0.0.0.0

#spring.main.allow-bean-definition-overriding=true


# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.sql.init.mode=always

## Redis configuration
spring.redis.host=localhost
spring.redis.port=6379
#spring.redis.password=Pay@secure

# Connection pool
#spring.datasource.hikari.connection-timeout=20000
#spring.datasource.hikari.minimum-idle=5
#spring.datasource.hikari.idle-timeout=300000
#spring.datasource.hikari.max-lifetime=1200000

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.DEMO=DEBUG

spring.datasource.url=jdbc:mysql://localhost:3306/ankitLocal
spring.datasource.username=root
spring.datasource.password=Pay@secure
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.hikari.pool-name=HikariCP
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG
logging.level.org.springframework.data.redis.connection.lettuce=DEBUG


# See SQL executed by Hibernate
hibernte.show-sql = true
logging.level.org.hibernate.SQL=DEBUG
# See parameters bound to SQL statements
logging.level.org.hibernate.type.descriptor.sql=TRACE
# See transaction activity (VERY IMPORTANT)
logging.level.org.springframework.transaction=TRACE
# See JPA activity (including session flushing)
logging.level.org.springframework.orm.jpa=TRACE
# See DataSource initialization details
logging.level.org.springframework.jdbc.datasource.init=DEBUG


management.endpoints.web.exposure.include=health
